<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>The Trader's Mind — Four Book Synthesis</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0A0A0D;color:#E0DDD6;font-family:Georgia,serif;min-height:100vh}
button{font-family:Georgia,serif;cursor:pointer}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:#2A2A2E;border-radius:3px}
#hdr{padding:20px 28px 14px;border-bottom:1px solid #1A1A1E;background:#0D0D10}
#hdr .sup{font-size:9px;letter-spacing:4px;color:#555;margin-bottom:6px;font-family:monospace}
#hdr h1{font-size:19px;font-weight:400}
#nav{display:flex;border-bottom:1px solid #1A1A1E;background:#0D0D10;overflow-x:auto}
.nb{flex-shrink:0;padding:12px 16px;background:transparent;border:none;border-bottom:2px solid transparent;text-align:left}
.nb .tag{font-size:9px;letter-spacing:3px;margin-bottom:3px;font-family:monospace}
.nb .nm{font-size:13px;color:#777}.nb.on .nm{color:#E0DDD6}
.nb .au{font-size:11px;color:#555}
#wrap{display:flex;height:calc(100vh - 108px)}
#sidebar{width:220px;flex-shrink:0;border-right:1px solid #1A1A1E;background:#0A0A0E;overflow-y:auto;padding:14px 0}
.sp{padding:0 14px 10px;border-bottom:1px solid #141418;margin-bottom:8px}
.sp .lbl{font-size:9px;letter-spacing:3px;margin-bottom:4px;font-family:monospace}
.sp p{font-size:11px;color:#666;line-height:1.6}
.sbn{width:100%;padding:7px 10px;background:transparent;border:none;border-left:2px solid transparent;text-align:left;margin-bottom:1px}
.sbn .n{font-size:9px;margin-bottom:2px;font-family:monospace}
.sbn .t{font-size:12px;color:#777;line-height:1.3}
.sbn.on{background:#141420}.sbn.on .t{color:#E0DDD6}
#content{flex:1;padding:22px 30px;overflow-y:auto}
.bh .tag{font-size:9px;letter-spacing:3px;margin-bottom:6px;font-family:monospace}
.bh h2{font-size:21px;font-weight:400;margin-bottom:3px}
.bh .au{font-size:13px;color:#666;margin-bottom:16px}
.pb{padding:16px 20px;background:#0F0F14;margin-bottom:22px}
.pb .lbl{font-size:9px;letter-spacing:3px;margin-bottom:6px;font-family:monospace}
.pb p{font-size:14px;color:#C4C0B6;line-height:1.85;font-style:italic}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.cc{padding:11px 13px;background:#0F0F14;border:1px solid #1A1A1E;border-radius:3px;text-align:left;width:100%;transition:border-color .12s}
.cc .n{font-size:9px;margin-bottom:3px;font-family:monospace}
.cc .t{font-size:12px;color:#CCC;line-height:1.3}
.bl{padding:15px 19px;border-radius:3px;margin-bottom:11px;border:1px solid;border-left-width:3px}
.bl .lbl{font-size:9px;letter-spacing:3px;margin-bottom:7px;font-family:monospace}
.bl .body{font-size:14px;line-height:1.9}
.ch .back{background:none;border:none;color:#555;font-size:11px;padding:0 0 12px;font-family:monospace;letter-spacing:1px}
.ch .pos{font-size:9px;letter-spacing:3px;margin-bottom:4px;font-family:monospace}
.ch h2{font-size:18px;font-weight:400;line-height:1.4;margin-bottom:17px;color:#E0DDD6}
.np{display:flex;gap:8px;margin-top:20px;padding-top:15px;border-top:1px solid #1A1A1E}
.npb{flex:1;padding:9px 11px;background:#0F0F14;border:1px solid #1A1A1E;border-radius:3px}
.npb .d{font-size:9px;color:#555;margin-bottom:2px;font-family:monospace}
.npb .pt{font-size:12px;color:#999}
.npb.r{text-align:right}
#gv{padding:26px 30px}
#gv .pt,#sv .pt{font-size:10px;letter-spacing:3px;margin-bottom:7px;font-family:monospace}
#gv h2,#sv h2{font-size:20px;font-weight:400;margin-bottom:5px}
#gv .ds,#sv .ds{color:#666;font-size:14px;margin-bottom:22px;line-height:1.7}
.gc{margin-bottom:9px;background:#0F0F14;border:1px solid #1E1E28;border-radius:4px;overflow:hidden;transition:border-color .15s}
.gc.op{border-color:#E88060}
.gb2{width:100%;padding:13px 16px;background:transparent;border:none;text-align:left;display:flex;align-items:flex-start;gap:10px}
.gb2 .m .gn{font-size:9px;color:#E88060;font-family:monospace;margin-bottom:2px}
.gb2 .m .ar{font-size:16px;color:#444}
.gc.op .ar{color:#E88060}
.gb2 .gq{font-size:14px;color:#D0CCC4;line-height:1.45}
.gtags{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.btag{font-size:10px;padding:2px 6px;background:#1A1A20;border:1px solid #2A2A30;border-radius:2px;color:#888;font-family:monospace}
.ttag{font-size:10px;padding:2px 6px;background:#1A1028;border:1px solid #2A1A38;border-radius:2px;color:#C87EC8;font-family:monospace}
.gbody{padding:0 16px 16px}
.gbl{padding:12px 15px;border-radius:3px;margin-bottom:9px;border-left:3px solid}
.gbl .lbl{font-size:9px;letter-spacing:3px;margin-bottom:5px;font-family:monospace}
.gbl .txt{font-size:14px;line-height:1.8}
#sv{padding:26px 30px}
.sc{margin-bottom:13px;background:#0F0F14;border:1px solid #1E1E28;border-radius:4px;overflow:hidden}
.sh{padding:11px 15px;background:#141420;border-bottom:1px solid #1E1E28;display:flex;align-items:center;gap:9px}
.sh .ic{font-size:15px;color:#9B7EC8}
.sh .th{font-size:14px;color:#E0DDD6}
.scols{padding:13px 15px;display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px}
.scol .cl{font-size:9px;letter-spacing:3px;margin-bottom:5px;font-family:monospace}
.scol p{font-size:12px;color:#999;line-height:1.7}
.sapp{padding:11px 15px;background:#0A100A;border-top:1px solid #1A2A1A}
.sapp .lbl{font-size:9px;letter-spacing:3px;color:#7EC8A0;margin-bottom:4px;font-family:monospace}
.sapp p{font-size:13px;color:#B0CEB8;line-height:1.7}
.cn{font-size:10px;color:#555;margin-bottom:9px;font-family:monospace}
</style>
</head>
<body>
<div id="hdr">
  <div class="sup">TRADING PSYCHOLOGY · MASTER LIBRARY · FUTURES EDITION</div>
  <h1>The Trader's Mind — Four Book Synthesis</h1>
</div>
<div id="nav"></div>
<div id="wrap">
  <div id="sidebar"></div>
  <div id="content"></div>
</div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
